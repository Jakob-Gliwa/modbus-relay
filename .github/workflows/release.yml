name: Publish Docker Hub image
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: read
  actions: read
concurrency:
  group: dockerhub-release
  cancel-in-progress: false
env:
  IMAGE: acidcliff/modbus-relay
jobs:
  verify:
    if: github.repository == 'Jakob-Gliwa/modbus-relay' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      source_sha: ${{ steps.verify.outputs.source_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - name: Require successful main CI for this exact commit
        id: verify
        run: python3 scripts/verify-release.py
        env:
          GH_TOKEN: ${{ github.token }}
  publish:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    environment: dockerhub
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.verify.outputs.source_sha }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          username: acidcliff
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build native image and push immutable digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          build-args: RELEASE_VERSION=${{ github.ref_name }}
          outputs: type=image,name=acidcliff/modbus-relay,push-by-digest=true,name-canonical=true,push=true
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=docker-build-v2-${{ matrix.arch }}
          # A tag-scoped cache cannot be reused by main; do not export it.
      - name: Smoke-test the exact uploaded image before tagging
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          docker pull "$IMAGE@$DIGEST"
          test "$(docker run --rm "$IMAGE@$DIGEST" --version)" = "modbus-relay ${RELEASE_TAG#v}"
          python3 scripts/docker-smoke.py "$IMAGE@$DIGEST"
      - name: Export verified digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1
  tag:
    needs: publish
    runs-on: ubuntu-24.04
    environment: dockerhub
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: digests-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          username: acidcliff
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        id: meta
        with:
          images: acidcliff/modbus-relay
          tags: |
            type=semver,pattern={{version}}
            type=sha
      - name: Tag the two verified platforms as one image
        env:
          METADATA_JSON: ${{ steps.meta.outputs.json }}
        run: |
          python3 - <<'PYTHON'
          import json, os, re, subprocess
          from pathlib import Path
          digests = sorted(p.name for p in (Path(os.environ['RUNNER_TEMP']) / 'digests').iterdir())
          assert len(digests) == 2 and all(re.fullmatch('[a-f0-9]{64}', d) for d in digests)
          tags = json.loads(os.environ['METADATA_JSON'])['tags']
          assert tags and all(t.startswith('acidcliff/modbus-relay:') for t in tags)
          command = ['docker', 'buildx', 'imagetools', 'create']
          for tag in tags:
              command.extend(['--tag', tag])
          command.extend('acidcliff/modbus-relay@sha256:' + d for d in digests)
          subprocess.run(command, check=True)
          subprocess.run(['docker', 'buildx', 'imagetools', 'inspect', tags[0]], check=True)
          PYTHON
