name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  schedule:
    - cron: '41 5 * * *'
  workflow_dispatch:
    inputs:
      benchmark_runners:
        description: Compare cargo test and nextest on the Linux runner
        type: boolean
        default: false
      benchmark_docker_cache:
        description: Measure warm and source-only Docker rebuilds on native runners
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' && github.ref_type == 'branch' }}
env:
  CARGO_TERM_COLOR: always
  PROPTEST_CASES: 2048
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          key: tests-${{ matrix.os }}
      - if: runner.os == 'Linux'
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --doc
          cargo doc --locked --no-deps
          python3 -m unittest discover -s scripts -p 'test_*.py'
        env:
          RUSTDOCFLAGS: -D warnings
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32
        with:
          tool: cargo-nextest
      - run: cargo nextest run --profile ci --locked --all-targets
      - run: cargo nextest run --profile ci --release --locked --all-targets
      - if: github.event_name == 'workflow_dispatch' && inputs.benchmark_runners && runner.os == 'Linux'
        run: python3 scripts/benchmark-test-runners.py --threads "$(nproc)" --output target/runner-benchmark/results.json
      - if: github.event_name == 'workflow_dispatch' && inputs.benchmark_runners && runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: linux-test-runner-comparison
          path: target/runner-benchmark/results.json
          retention-days: 14
  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8
        with:
          toolchain: 1.99.1
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          key: coverage
          workspaces: . -> target/llvm-cov-target
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32
        with:
          tool: cargo-llvm-cov
      - run: cargo llvm-cov --locked --all-targets --ignore-filename-regex 'examples/' --fail-under-lines 95 --lcov --output-path lcov.info
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: coverage
          path: lcov.info
          retention-days: 14
  docker:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Test optimized Linux binaries
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          target: test
          outputs: type=cacheonly
          cache-from: |
            type=gha,scope=docker-tests-v2-${{ matrix.arch }}
            type=gha,scope=docker-build-v2-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=docker-tests-v2-${{ matrix.arch }}
      - name: Load final scratch image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: modbus-relay:test
          # The same builder already imported both caches in the preceding step.
          cache-to: type=gha,mode=max,scope=docker-build-v2-${{ matrix.arch }}
      - run: python3 scripts/docker-smoke.py modbus-relay:test
      - if: github.event_name == 'workflow_dispatch' && inputs.benchmark_docker_cache
        run: python3 scripts/benchmark-docker-cache.py
      - if: github.event_name == 'workflow_dispatch' && inputs.benchmark_docker_cache
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: docker-cache-benchmark-${{ matrix.arch }}
          path: target/docker-cache-benchmark.json
          retention-days: 14
  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          key: dependencies
          cache-targets: false
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32
        with:
          tool: cargo-deny
      - run: cargo deny check
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Scan full Git history
        run: |
          scan_dir="$(mktemp -d)"
          gh release download v8.30.1 --repo gitleaks/gitleaks \
            --pattern gitleaks_8.30.1_linux_x64.tar.gz --dir "$scan_dir"
          (cd "$scan_dir" && echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks_8.30.1_linux_x64.tar.gz' | sha256sum --check)
          tar -xzf "$scan_dir/gitleaks_8.30.1_linux_x64.tar.gz" -C "$scan_dir" gitleaks
          "$scan_dir/gitleaks" git . --redact --no-banner
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
