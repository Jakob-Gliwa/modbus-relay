[package]
name = "modbus-relay"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Bounded, observable Modbus TCP proxy"
license = "GPL-3.0-only"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
httparse = "1.10"
serde = { version = "1", features = ["derive"] }
serde-saphyr = { version = "2.0.0", default-features = false, features = ["deserialize"] }
serde_json = "1"
tokio = { version = "1.53", features = ["rt", "rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }
toml = { version = "1.1", features = ["parse", "serde"], default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "registry", "std"], default-features = false }

[dev-dependencies]
proptest = "1.11"
tokio = { version = "1.53", features = ["test-util"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
